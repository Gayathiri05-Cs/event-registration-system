<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Organizer Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="nav"><a class="brand" href="/">Event<span>ly</span></a><nav><span class="muted">Welcome, {{ session.organizer_name }}</span><a href="/organizer/logout">Logout</a></nav></header><main><section class="dash-head"><div><span class="eyebrow">ORGANIZER SPACE</span><h1>Your event dashboard</h1><p class="muted">Create events and monitor participant registrations.</p></div><button id="showCreate" class="btn">+ Create event</button></section><section id="createPanel" class="panel form-panel hidden"><h2>Create a new event</h2><form id="eventForm" class="event-form"><label>Event title<input name="title" required></label><label>Category<select name="category" required><option value="">Choose category</option><option>Technology</option><option>Entrepreneurship</option><option>Career</option><option>Design</option><option>Competition</option><option>Other</option></select></label><label>Description<textarea name="description" required rows="3"></textarea></label><label>Date<input name="event_date" type="date" required></label><label>Time<input name="event_time" placeholder="10:00 AM" required></label><label>City / Location<input name="location" required></label><label>Venue<input name="venue" required></label><label>Seat limit<input name="capacity" type="number" min="1" max="100000" required></label><button class="btn" type="submit">Save event</button><p id="createMessage" role="status"></p></form></section><section class="section-head"><h2>Managed events</h2><span id="eventCount" class="muted"></span></section><div id="managedEvents" class="managed-list">Loading...</div></main><footer>© 2026 Evently</footer><script src="/static/dashboard.js"></script></body></html>
